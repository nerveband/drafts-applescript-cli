# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

builds:
  - id: "drafts"
    dir: "./cmd/drafts"
    binary: "drafts"
    flags:
      - -mod=readonly
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - "darwin"
    goarch:
      - "amd64"
      - "arm64"

archives:
  - id: drafts
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - drafts
    files:
      - LICENSE
      - CHANGELOG.md
      - README.md
      - AGENTS.md
      - skills/SKILL.md
      - docs/verification.md
      - docs/review.md
      - scripts/live-fixture-test.py

checksum:
  name_template: "checksums.txt"
